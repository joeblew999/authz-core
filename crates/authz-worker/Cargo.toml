[package]
name = "authz-worker"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
authz-core   = { path = "../.." }
worker       = { version = "=0.8.1", features = ["d1"] }
serde        = { version = "1", features = ["derive"] }
js-sys       = "0.3"
async-trait  = "0.1"
serde_json   = "1"
console_error_panic_hook = "0.1"
getrandom    = { version = "0.2", features = ["js"] }
